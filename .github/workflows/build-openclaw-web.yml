# Real OpenClaw browser build using a matching engine/custom-asset revision.
name: Build Real OpenClaw Web

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-openclaw-web.yml'
      - 'tools/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make python3 git unzip curl xz-utils

      - name: Fetch matching real OpenClaw source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --no-checkout https://github.com/pjasicek/OpenClaw.git OpenClaw
          cd OpenClaw
          git fetch --depth 1 origin 5ee5740ca98377c76b13b50c84f610b0066a4717
          git checkout --detach 5ee5740ca98377c76b13b50c84f610b0066a4717
          test "$(git rev-parse HEAD)" = "5ee5740ca98377c76b13b50c84f610b0066a4717"

      - name: Fetch official OpenClaw v1.03 package for original CLAW.REZ
        run: |
          curl -L --fail --retry 5 \
            -o OpenClaw_v1.03.zip \
            https://github.com/pjasicek/OpenClaw/releases/download/v0.3/OpenClaw_v1.03.zip
          mkdir game-release
          unzip -q OpenClaw_v1.03.zip -d game-release

      - name: Install known-compatible Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 1.39.11
          ./emsdk activate 1.39.11

      - name: Prepare matched game resources
        shell: bash
        run: |
          set -euxo pipefail
          SRC_RELEASE="OpenClaw/Build_Release"
          CLAW_REZ=$(find game-release -type f -iname 'CLAW.REZ' -print -quit)
          test -n "$CLAW_REZ"

          # Only CLAW.REZ comes from the old binary release.
          # Keep ASSETS.ZIP/config/font/console from the exact source revision,
          # because those custom assets must match the C++ actor prototype list.
          cp "$CLAW_REZ" "$SRC_RELEASE/CLAW.REZ"

          test -s "$SRC_RELEASE/ASSETS.ZIP"
          test -s "$SRC_RELEASE/config.xml"
          test -s "$SRC_RELEASE/clacon.ttf"
          test -s "$SRC_RELEASE/console02.tga"

          # Regression guard for the exact V3 failure seen on Android.
          unzip -l "$SRC_RELEASE/ASSETS.ZIP" | grep -qi 'LEVEL13'
          grep -q '<LastImplementedLevel>13</LastImplementedLevel>' "$SRC_RELEASE/config.xml"

          echo 'Matched resources:'
          ls -lh "$SRC_RELEASE/CLAW.REZ" "$SRC_RELEASE/ASSETS.ZIP" "$SRC_RELEASE/config.xml"

      - name: Apply Android/mobile web compatibility patch
        run: |
          python3 tools/patch_openclaw_mobile.py OpenClaw
          grep -n "OPENCLAW_BROWSER_GAME_READY" OpenClaw/OpenClaw/Engine/GameApp/BaseGameApp.cpp
          grep -n "ALLOW_MEMORY_GROWTH" OpenClaw/CMakeLists.txt
          grep -n "<ControlOptions>" OpenClaw/Build_Release/config.xml

      - name: Configure genuine Emscripten build
        shell: bash
        run: |
          set -euxo pipefail
          source "$GITHUB_WORKSPACE/emsdk/emsdk_env.sh"
          mkdir -p OpenClaw/build-web
          cd OpenClaw/build-web
          emcmake cmake -DEmscripten=1 -DExtern_Config=0 ..

      - name: Compile genuine OpenClaw engine
        shell: bash
        run: |
          set -euxo pipefail
          source "$GITHUB_WORKSPACE/emsdk/emsdk_env.sh"
          cmake --build OpenClaw/build-web -- -j2

      - name: Inspect generated web build
        shell: bash
        run: |
          set -euxo pipefail
          test -s OpenClaw/Build_Release/openclaw.js
          test -s OpenClaw/Build_Release/openclaw.wasm
          test -s OpenClaw/Build_Release/openclaw.data
          test -s OpenClaw/Build_Release/openclaw.html
          find OpenClaw/Build_Release -maxdepth 1 -type f \
            \( -name 'openclaw.*' -o -name 'CLAW.REZ' -o -name 'ASSETS.ZIP' \) \
            -printf '%f %s bytes\n' | sort

      - name: Package genuine web artifacts
        run: |
          mkdir -p artifact
          cp OpenClaw/Build_Release/openclaw.html artifact/
          cp OpenClaw/Build_Release/openclaw.js artifact/
          cp OpenClaw/Build_Release/openclaw.wasm artifact/
          cp OpenClaw/Build_Release/openclaw.data artifact/
          printf '%s\n' \
            'Real pjasicek/OpenClaw C++ engine compiled with Emscripten.' \
            'Engine/custom assets pinned to OpenClaw commit 5ee5740ca98377c76b13b50c84f610b0066a4717.' \
            'Original CLAW.REZ comes from official OpenClaw v1.03 release.' \
            'Important V4 fix: master ASSETS.ZIP is preserved so Level 13 actor prototypes match the engine.' \
            'Android patch: software SDL renderer, growable WASM memory, non-fatal audio fallback, touch enabled.' \
            > artifact/BUILD_INFO.txt

      - name: Build giant standalone HTML V4
        run: |
          python3 tools/package_single_html.py \
            OpenClaw/Build_Release \
            artifact/OpenClaw_FULL_REAL_Mobile_Single_File_V4.html
          test -s artifact/OpenClaw_FULL_REAL_Mobile_Single_File_V4.html
          ls -lh artifact/OpenClaw_FULL_REAL_Mobile_Single_File_V4.html

      - name: Upload genuine web build V4
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-real-web-build-V4
          path: |
            artifact/openclaw.html
            artifact/openclaw.js
            artifact/openclaw.wasm
            artifact/openclaw.data
            artifact/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload giant standalone HTML V4
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-FULL-REAL-Single-HTML-V4
          path: artifact/OpenClaw_FULL_REAL_Mobile_Single_File_V4.html
          if-no-files-found: error
          retention-days: 7
